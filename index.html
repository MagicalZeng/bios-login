<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>工作台登录 · BIOS 3.0</title>
  <link rel="icon" type="image/png" href="./bios-icon.png">
  <link rel="apple-touch-icon" href="./bios-icon.png">
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./login.css">
  <script defer src="./login.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="studio" aria-labelledby="product-name">
      <img class="brand-logo" src="./bios-logo.png" alt="BIOS Collective">
      <div class="wave-field" aria-hidden="true">
        <img src="./collective-field.webp" alt="" width="974" height="470" fetchpriority="high">
      </div>
      <div class="studio-copy">
        <div class="product-id" aria-label="BIOS 3.0">BIOS / 3.0</div>
        <h1 id="product-name">网络工作台</h1>
        <p>管理你的设备、流量与客户端版本。</p>
      </div>
    </section>
    <section class="access-panel" aria-labelledby="form-title">
      <div class="utilities">
        <button type="button" class="quiet" id="help-open"><svg class="icon" aria-hidden="true"><use href="./interface-icons.svg#help"/></svg>登录帮助</button>
      </div>
      <div class="credentials">
        <h2 id="form-title">登录工作台</h2>
        <p id="entry-note" role="status">正在检查登录服务…</p>
        <div id="entry"></div>
        <noscript><p>请启用 JavaScript 后重新打开登录页面。</p></noscript>
        <div class="device-info" id="device-info" hidden>
          <svg class="icon" aria-hidden="true"><use href="./interface-icons.svg#devices"/></svg>
          <span>本机系统</span><strong id="device-platform"></strong>
        </div>
      </div>
      <footer>门户版本 1.01</footer>
    </section>
  </main>
  <dialog id="help" aria-labelledby="help-title">
    <div class="dialog-head"><h2 id="help-title">登录帮助</h2><button type="button" class="quiet close-help" aria-label="关闭帮助">关闭</button></div>
    <p>输入管理员分配的昵称、账号和密码。昵称需与登记信息一致。</p>
    <p>每个账号最多绑定两台设备。浏览器资料用于识别当前设备，清除资料或更换浏览器后可能需要重新绑定。</p>
    <p>名额已满时，请通过已登录设备在「我的设备」中解绑旧设备，或联系管理员。</p>
  </dialog>
  <template id="login-template"><form id="login-form" method="post" action="/api/login">
    <div class="form-field">
      <label for="nickname">昵称</label>
      <input id="nickname" name="nickname" placeholder="登记时使用的昵称" required maxlength="64" autocomplete="nickname">
    </div>
    <div class="form-field">
      <label for="account">账号</label>
      <input id="account" name="account" placeholder="公司分配的账号" required maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="form-field">
      <label for="password">密码</label>
      <div class="password-wrap"><input id="password" name="password" placeholder="输入密码" type="password" autocomplete="current-password" required maxlength="128"><button type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">显示</button></div>
    </div>
    <p class="error" id="login-error" role="alert"></p>
    <button type="submit" class="primary full">登录工作台 <svg class="icon" aria-hidden="true"><use href="./interface-icons.svg#arrow"/></svg></button>
  </form></template>
</body>
</html>
