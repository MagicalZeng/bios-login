<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>员工登录 · BIOS 3.0</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./login.css">
  <script defer src="./login.js"></script>
</head>
<body class="login-page">
  <header class="topbar">
    <span class="brand"><i class="brand-mark" aria-hidden="true"><b></b><b></b><b></b></i> BIOS <strong>3.0</strong></span>
    <button type="button" class="quiet" id="help-open">登录帮助</button>
  </header>
  <main class="login-shell">
    <section class="intro">
      <div class="intro-text"><h1>员工访问门户</h1><p>在一个工作台管理你的设备、流量和客户端版本。</p></div>
      <div class="sculpture" aria-hidden="true"><div class="halo"></div><div class="tiles"><i class="tile tile-a"></i><i class="tile tile-b"></i><i class="tile tile-c"></i><i class="tile tile-d"><b class="cutout"></b></i></div></div>
      <span class="intro-platforms">Windows <span aria-hidden="true">/</span> macOS</span>
    </section>
    <section class="access-panel" aria-labelledby="form-title">
      <h2 id="form-title">登录工作台</h2>
      <p class="muted" id="entry-note" role="status">正在检查登录服务…</p>
      <div id="entry"></div>
      <noscript><p>请启用 JavaScript 后重新打开登录页面。</p></noscript>
    </section>
  </main>
  <footer class="login-footer"><span>BIOS 3.0</span><span>门户版本 1.01</span></footer>
  <dialog id="help"><div class="dialog-head"><h2>登录帮助</h2><button type="button" class="quiet close-help" aria-label="关闭帮助">关闭</button></div><p>输入管理员分配的昵称、账号和密码。请保留昵称与账号中的原始大小写。</p><p>每个账号最多绑定两台设备。浏览器资料用于识别当前设备，清除资料或更换浏览器后可能需要重新绑定。</p><p>名额已满时，请通过已登录设备在「设备」中解绑旧设备，或联系管理员。</p></dialog>
  <template id="login-template"><form id="login-form" method="post" action="/api/login">
    <label for="nickname">昵称</label><input id="nickname" name="nickname" required maxlength="64" autocomplete="nickname">
    <label for="account">账号</label><input id="account" name="account" required maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="password">密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">显示</button></div>
    <p class="error" id="login-error" role="alert"></p><button type="submit" class="primary full">登录工作台 <span aria-hidden="true">→</span></button>
  </form></template>
</body>
</html>
